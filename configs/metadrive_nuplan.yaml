defaults:
  - metadrive
  - _self_

logdir: logdir/metadrive_nuplan/${now:%Y-%m-%d}/${now:%H-%M-%S}
env:
  task: metadrive_nuplan
  scenario_dataset: nuplan
  scenario_train_dir: ${oc.env:NUPLAN_MINI_DATA_ROOT,datasets/nuplan/scenarionet_mini}/train
  scenario_eval_dir: ${oc.env:NUPLAN_MINI_DATA_ROOT,datasets/nuplan/scenarionet_mini}/val
  num_scenarios: -1
  eval_num_scenarios: -1
  reactive_traffic: false
  chassis:
    enabled: true
    mass_scales: [0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4]
    steering_scales: [1.0]
    friction_scales: [0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.4]
