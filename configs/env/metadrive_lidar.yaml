task: metadrive_roundabout
steps: 500000
env_num: 8
eval_episode_num: 20
eval_env_num: 2
action_repeat: 1
train_ratio: 512
time_limit: 1000
seed: ${seed}
device: ${device}

# Disjoint procedural map seeds for training and evaluation.
start_seed: 0
num_scenarios: 100
eval_start_seed: 10000
eval_num_scenarios: 20
lane_num: 2
traffic_density: 0.2
traffic_mode: trigger
# Each decision advances 5 physics ticks of 0.02 seconds (10 Hz control).
decision_repeat: 5
reward:
  mode: paper
  progress: 1.0
  speed: 0.1
  lateral: 0.0
  success: 10.0
  crash: 20.0
  out_of_road: 10.0
  max_speed_km_h: 50.0
spawn:
  randomize: true
  # Four entrances, two lanes, random longitudinal/lateral position and exit.
  longitude_min: 5.0
  longitude_max: 25.0
  lateral_max: 0.5
termination:
  out_of_road_done: true
  on_continuous_line_done: true
  on_broken_line_done: false
  out_of_route_done: false
lidar:
  num_lasers: 240
  distance: 50
  num_others: 0

encoder:
  mlp_keys: '^state$'
  cnn_keys: '$^'
decoder:
  mlp_keys: '^state$'
  cnn_keys: '$^'

context_enabled: ${model.context.enabled}
context_kinematics: true  # Per-step speed + measured front-wheel angle; false restores legacy state2/tokens4.

# Disabled for legacy runs. Each draw is fixed for the entire episode.
chassis:
  enabled: false
  models: [default, m, l]
  mass_scales: [0.8, 0.9, 1.0, 1.1, 1.2]
  steering_scales: [0.8, 0.9, 1.0, 1.1, 1.2]
  eval_models: ${env.chassis.models}
  eval_mass_scales: ${env.chassis.mass_scales}
  eval_steering_scales: ${env.chassis.steering_scales}
